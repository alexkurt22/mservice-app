name: mservice_app
description: M-Service Client App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0
  flutter_ringtone_player: ^4.0.0+4
  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.6
  share_plus: ^13.2.1
  firebase_messaging: ^15.2.10
  googleapis_auth: ^1.4.1
  http: ^1.2.0

# ВОТ ОНО - БЛОКИРУЕМ БАГОВАННЫЕ ОБНОВЛЕНИЯ GOOGLE:
dependency_overrides:
  shared_preferences_android: 2.2.2
  path_provider_android: 2.2.4
  url_launcher_android: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/firebase_credentials.json
