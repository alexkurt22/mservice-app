name: mservice_app
description: M-Service Client App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0
  flutter_ringtone_player: ^4.0.0+4
  cupertino_icons: ^1.0.8
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  firebase_messaging: ^14.9.4
  googleapis_auth: ^1.4.1
  http: ^1.2.0
  image_picker: ^1.1.2
  flutter_sound: ^9.2.13
  permission_handler: ^11.3.1
  just_audio: ^0.9.36 # Для воспроизведения аудио в чате
  path_provider: ^2.1.2 # Для сохранения временных файлов
  speech_to_text: ^6.5.1 # ДЛЯ ТРАНСКРИБАЦИИ ГОЛОСА

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/firebase_credentials.json
